<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML Website</title>
    <!-- SEO meta tags -->
    <meta name="description" content="A simple html-only website from roadmap.sh">
    <meta name="keywoards" content="Frontend Projects, HTML, Roadmap.sh">
    <meta name="author" content="Muhammad Hasby S">
</head>

<body>
    <header>
        <div class="logo">
            <img src="../assets/img1.jpg" alt="Logo" width="64">
            <p>M Hasby </p>
        </div>
        <nav>
            <ul>
                <li><a href="#">Homepage</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="articles.html">Articles</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="contact">
            <h1>Contact Me</h1>
            <form action="">
                <div class="name">
                    <label for="name">Name: </label>
                    <input type="text" name="name" id="name" required>
                </div>
                <div class="email">
                    <label for="email">Email: </label>
                    <input type="email" name="email" id="email" required>
                </div>
                <div class="message">
                    <label for="message">Message</label>
                    <textarea name="Message" id="message" rows="5" required></textarea>
                </div>
                <button>Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; All right reserved 2026</p>
    </footer>
</body>

</html>
