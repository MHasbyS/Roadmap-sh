<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Comparison Table</title>
</head>

<body>
    <header>
        <h1>Acme Plans</h1>
        <nav>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Contact</li>
            </ul>
        </nav>
    </header>
    <main>
        <table border="1">
            <caption>
                <h2>Plan Comparison</h2>
            </caption>
            <thead>
                <th scope="col">Plan</th>
                <th scope="col">Storage</th>
                <th scope="col">Projects</th>
                <th scope="col">Support</th>
            </thead>
            <tbody>
                <tr>
                    <th scope="row">Free</th>
                    <td>5GB</td>
                    <td>3</td>
                    <td>Email</td>
                </tr>

                <tr>
                    <th scope="row">Pro</th>
                    <td>100GB</td>
                    <td>25</td>
                    <td>Priority Email</td>
                </tr>

                <tr>
                    <th scope="row">Business</th>
                    <td>1TB</td>
                    <td>Unlimited</td>
                    <td>24/7 Phone</td>
                </tr>
                <tr>
                    <td colspan="4">All plans include SSL and daily backups</td>
                </tr>
            </tbody>
        </table>
    </main>
    <footer>
        <p>&copy;2026 Acme Plans. All rights reserved.</p>
    </footer>
</body>

</html>
